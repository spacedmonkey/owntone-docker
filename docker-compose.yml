services:
  airptpd:
    build:
      context: ./docker/airptpd
      args:
        LIBAIRPTP_REF: ${LIBAIRPTP_REF:-0.7}
    container_name: airptpd
    network_mode: host
    ipc: shareable
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # OwnTone only looks for the daemon at startup, so wait until it is up
    healthcheck:
      test: ["CMD", "test", "-e", "/dev/shm/airptp_shm"]
      interval: 30s
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  owntone:
    image: docker.io/owntone/owntone:${OWNTONE_TAG:-latest}
    container_name: owntone
    network_mode: host
    # Share the IPC namespace so OwnTone can read airptpd's shared memory
    ipc: "service:airptpd"
    environment:
      - UID=1000
      - GID=1000
    volumes:
      - ${CONFIG_DIR:-./config}/owntone:/etc/owntone
      - ${CACHE_DIR:-./cache}/owntone:/var/cache/owntone
      - ${MUSIC_DIR:-./music}:/srv/media
      - ${PIPES_DIR:-./pipes}:/srv/pipes
    depends_on:
      airptpd:
        condition: service_healthy
        restart: true
      librespot:
        condition: service_started
    restart: unless-stopped

  librespot:
    image: giof71/librespot:latest
    container_name: librespot
    network_mode: host
    environment:
      - BACKEND=pipe
      - DEVICE=/mnt/pipe/spotify
      - BITRATE=${SPOTIFY_BITRATE:-320}
      - INITIAL_VOLUME=${SPOTIFY_INITIAL_VOLUME:-100}
      - DEVICE_NAME=${SPOTIFY_DEVICE_NAME:-Jukebox}
      - DEVICE_TYPE=${SPOTIFY_DEVICE_TYPE:-speaker}
      - ONEVENT_COMMAND=spotify-metadata.sh
    volumes:
      - ${PIPES_DIR:-./pipes}:/mnt/pipe
      - ./scripts/spotify-metadata.sh:/userscripts/spotify-metadata.sh
    restart: unless-stopped

  shairport-sync:
    image: mikebrady/shairport-sync:classic
    container_name: shairport-sync
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${PIPES_DIR:-./pipes}:/data
      - ${CONFIG_DIR:-./config}/shairport/shairport-sync.conf:/etc/shairport-sync.conf:ro
